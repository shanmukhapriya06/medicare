# ============================================================
# MediCare – Render Blueprint Specification
# Deploys the Spring Boot backend as a Docker Web Service on Render
# ============================================================
services:
  - type: web
    name: medicare-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      # Cloud Database connection URL (e.g. from Aiven, Clever Cloud, TiDB, Railway)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Automatically generated cryptographically secure JWT signing secret
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      # Permitted web origins - update with your exact Vercel production URL
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://*.vercel.app
      - key: HIBERNATE_DDL_AUTO
        value: update
      - key: SHOW_SQL
        value: false
      - key: SEED_DEMO_DATA
        value: true
