spring.application.name=medicare-backend
server.port=${PORT:8080}

# ============================================================
# Multipart Upload Configuration (doctor credential documents)
# ============================================================
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB

# ============================================================
# MySQL Database Configuration
# Supports DB_URL (full JDBC URL string) or host/port/name parameters
# ============================================================
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medicare}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:priya@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# JWT Security Configuration
# The signing secret should be provided via JWT_SECRET in production.
# Expiration defaults to 86,400,000 ms (24 hours).
# ============================================================
jwt.secret=${JWT_SECRET:medicare_secret_key_for_jwt_token_must_be_at_least_256_bits_long_healthcare_system}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# CORS Allowed Origins
# Comma-separated list of allowed origins or wildcard patterns (e.g. https://*.vercel.app)
# ============================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,https://*.vercel.app}

# ============================================================
# Development Demo Data
# ============================================================
# On startup, DataInitializer seeds default administrator and demo doctors.
# Set to false to disable demo doctor seeding in production.
app.seed-demo-doctors=${SEED_DEMO_DATA:true}
